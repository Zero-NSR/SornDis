<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SornDis | DeltaRedz</title>
    <style>
        :root { --accent: #007aff; --bg: #000; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; padding: 20px; text-align: center; }
        .card { background: #111; border: 1px solid #222; border-radius: 30px; padding: 30px; max-width: 350px; margin: 50px auto; }
        .btn { background: var(--accent); color: white; padding: 18px; border-radius: 18px; border: none; width: 100%; font-weight: 700; cursor: pointer; font-size: 1.1rem; }
        .st { margin-top: 20px; font-size: 0.88rem; color: #888; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Sorn<span style="color:var(--accent)">Dis</span></h1>
        <p style="color:#888; font-size:14px;">تثبيت تطبيق DeltaRedz المباشر</p>
        <button class="btn" onclick="install()">تثبيت التطبيق</button>
        <div id="st" class="st"></div>
    </div>

    <script>
        function install() {
            const st = document.getElementById('st');
            st.innerText = "جاري إرسال أمر التثبيت...";
            
            // التثبيت المباشر عبر manifest_delta.plist بدون ملفات تعريف إضافية
            window.location.href = "itms-services://?action=download-manifest&url=https://zero-nsr.github.io/SornDis/manifest_delta.plist";
            
            setTimeout(() => {
                st.innerText = "إذا ظهرت لك نافذة التثبيت، اضغط تثبيت وارجع للشاشة الرئيسية.";
            }, 2000);
        }
    </script>
</body>
</html>
