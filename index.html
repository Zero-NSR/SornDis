<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SornDis | DeltaRedz</title>
    <style>
        :root { --accent: #007aff; --bg: #000; --card-bg: #111; --border: #222; }
        body { background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 28px; padding: 35px 25px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h1 { margin: 0 0 8px 0; font-size: 2rem; font-weight: 800; }
        p { color: #888; font-size: 0.9rem; margin-bottom: 25px; }
        .btn { background: var(--accent); color: white; padding: 18px; border-radius: 18px; border: none; width: 100%; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .btn:active { transform: scale(0.97); opacity: 0.9; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Sorn<span style="color:var(--accent)">Dis</span></h1>
        <p>تثبيت تطبيق DeltaRedz المباشر</p>
        <button class="btn" onclick="installApp()">تثبيت التطبيق 🚀</button>
    </div>

    <script>
        function installApp() {
            window.location.href = "itms-services://?action=download-manifest&url=https://zero-nsr.github.io/SornDis/manifest_delta.plist";
        }
    </script>
</body>
</html>
