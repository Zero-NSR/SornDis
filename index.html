<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SornDis | iOS Apps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { 
            --accent: #007aff; 
            --bg: #0c0c0c; 
            --card-bg: #161616;
            --border: #262626;
            --success: #34c759;
            --danger: #ff3b30;
        }

        body { 
            background-color: var(--bg); 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container { width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 20px; }
        .title { font-size: 32px; font-weight: 800; }
        .accent { color: var(--accent); }
        .subtitle { color: #888; font-size: 14px; margin-top: 5px; }

        .webclip-banner {
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.2), rgba(0, 122, 255, 0.05));
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .webclip-banner p { font-size: 13px; color: #ccc; margin-bottom: 10px; }

        .app-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .app-info { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .app-icon { width: 60px; height: 60px; border-radius: 14px; background-color: #222; object-fit: cover; }
        .app-details h3 { font-size: 18px; margin-bottom: 4px; }
        .app-details p { color: #888; font-size: 12px; }

        .status-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 4px;
        }

        .status-working { background-color: rgba(52, 199, 89, 0.15); color: var(--success); }
        .status-disabled { background-color: rgba(255, 59, 48, 0.15); color: var(--danger); }

        .btn-group { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-install { background-color: var(--accent); color: white; }
        .btn-webclip { background-color: var(--accent); color: white; width: 100%; }
        .btn-disabled { background-color: #2a2a2a; color: #666; cursor: not-allowed; }
        .btn-ipa { background-color: #222; color: white; border: 1px solid #333; }
        .btn:active:not(.btn-disabled) { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">Sorn<span class="accent">Dis</span></div>
            <div class="subtitle">منصة تحميل تطبيقات iOS</div>
        </div>

        <div class="webclip-banner">
            <p>مثّبّت الموقع على شاشة جهازك بدون متصفح</p>
            <a href="https://zero-nsr.github.io/SornDis/SornDis.mobileconfig" class="btn btn-webclip">
                <i class="fa-solid fa-mobile-screen"></i> تثبيت التطبيق على الشاشة
            </a>
        </div>

        <div id="apps-container"></div>
    </div>

    <script>
        const apps = [
            {
                name: "Delta Redz",
                version: "v2.733.988",
                icon: "https://zero-nsr.github.io/SornDis/icon.png",
                working: true,
                plistUrl: "https://zero-nsr.github.io/SornDis/manifest_delta.plist",
                // تم تعديل الرابط إلى dl=1 للتحميل المباشر
                ipaUrl: "https://dl.dropboxusercontent.com/scl/fi/us3z7qud1vzc57ybg6es0/DeltaRedz_2.733.988_1786463483.ipa?rlkey=0v4d0cesq7r5z03uva45ckxai&st=wa8lzzsl&dl=1"
            }
        ];

        function renderApps() {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';

                const statusBadge = app.working 
                    ? `<span class="status-badge status-working"><i class="fa-solid fa-circle-check"></i> يعمل✓</span>`
                    : `<span class="status-badge status-disabled"><i class="fa-solid fa-circle-xmark"></i> لا يعمل✕</span>`;

                const installButton = app.working
                    ? `<button class="btn btn-install" onclick="installApp('${app.plistUrl}')"><i class="fa-solid fa-download"></i> تثبيت</button>`
                    : `<button class="btn btn-disabled" disabled><i class="fa-solid fa-lock"></i> متوقف</button>`;

                card.innerHTML = `
                    <div class="app-info">
                        <img src="${app.icon}" class="app-icon" onerror="this.src='https://via.placeholder.com/60'">
                        <div class="app-details">
                            <h3>${app.name}</h3>
                            <p>الإصدار: ${app.version}</p>
                            ${statusBadge}
                        </div>
                    </div>
                    <div class="btn-group">
                        ${installButton}
                        <a href="${app.ipaUrl}" class="btn btn-ipa" download><i class="fa-solid fa-file-arrow-down"></i> IPA</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function installApp(plistUrl) {
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            if (!isSafari) {
                alert("يرجى فتح الموقع من متصفح Safari الأساسي في الآيفون لضمان التثبيت.");
                return;
            }
            window.location.href = "itms-services://?action=download-manifest&url=" + encodeURIComponent(plistUrl);
        }

        renderApps();
    </script>

</body>
</html>
